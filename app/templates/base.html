<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title if title else 'Flask App' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* Стилі для Завдання 3: Темна та Світла теми */
    body.theme-dark {
        background-color: #212529;
        color: #f8f9fa;
    }
    body.theme-light {
        background-color: #f8f9fa;
        color: #212529;
    }
    .theme-dark .card {
        background-color: #343a40;
        color: #ffffff;
    }
    
    /* Фікс для таблиці в темній темі */
    .theme-dark .table {
        --bs-table-bg: #343a40;
        --bs-table-color: #ffffff;
        background-color: #343a40 !important;
        color: #ffffff !important;
    }
    .theme-dark .table th, 
    .theme-dark .table td {
        background-color: #343a40 !important;
        color: #ffffff !important;
        border-color: #495057 !important;
    }
</style>
</head>
<body class="theme-{{ request.cookies.get('theme', 'light') }}">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/">Головна</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="/">Резюме</a></li>
            <li class="nav-item"><a class="nav-link" href="/users/login">Вхід</a></li>
            <li class="nav-item"><a class="nav-link" href="/users/profile">Профіль</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' or category == 'danger' else category }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
