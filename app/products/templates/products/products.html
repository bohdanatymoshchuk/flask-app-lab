{% extends 'base.html' %}

{% block title %}Список товарів{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Список товарів</h1>
    <div class="row">
        {% for product in products %}
            <div class="col-md-4 mb-3">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h5 class="card-title">{{ product.name }}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${{ product.price }}</h6>
                            <p class="card-text">{{ product.content[:60] }}...</p>
                        </div>
                        <a href="{{ url_for('products.detail_product', product_id=product.id) }}" class="btn btn-primary mt-3">Детальніше</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
